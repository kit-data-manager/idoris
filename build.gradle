import java.text.SimpleDateFormat

plugins {
    id "java"
    id "org.springframework.boot" version "3.5.0"    // 3.5.0-M*
    id "io.spring.dependency-management" version "1.1.7"
    id "io.freefair.lombok" version "8.13.1"
    id "io.freefair.maven-publish-java" version "8.13.1"
    id "org.owasp.dependencycheck" version "12.1.1"
    id "org.asciidoctor.jvm.convert" version "4.0.4"
    id "net.ltgt.errorprone" version "4.2.0"
    id "net.researchgate.release" version "3.1.0"
    id "com.gorylenko.gradle-git-properties" version "2.5.0"
    id "jacoco"
    id "com.github.ben-manes.versions" version "0.52.0"
}

description = 'IDORIS - An Integrated Data Type and Operations Registry with Inheritance System'
group = 'edu.kit.datamanager'
version = '0.0.2-SNAPSHOT'

// Update source/target compatibility syntax
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = uri("https://repo.spring.io/milestone")
    }
    // Add Sonatype snapshots repository for alpha versions
    maven {
        url = uri("https://oss.sonatype.org/content/repositories/snapshots")
    }
    // Add OpenTelemetry repository
    maven {
        url = uri("https://oss.jfrog.org/artifactory/oss-snapshot-local")
    }
}

ext {
    springBootVersion = "3.5.0"
    springDocVersion = "2.8.9"
    errorproneVersion = "2.38.0"
    errorproneJavacVersion = "9+181-r4173-1"
    httpClientVersion = "5.5"
    javersVersion = "7.3.7"
    micrometerVersion = "1.12.5"
    openTelemetryVersion = "1.49.0"
    openTelemetryInstrumentationVersion = "2.16.0"
    logbackVersion = "1.5.13"
    pyroscopeVersion = "0.13.0"
    set("snippetsDir", file("build/generated-snippets"))
    set('springModulithVersion', "1.4.1")
}

dependencies {
    /* Spring BOM – drives every spring-boot starter below */
    implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")

    /* Rules API */
    implementation project(':rules-api')

    /* Spring Boot starters (version comes from the BOM) */
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-data-neo4j"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-hateoas"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework:spring-web"
    implementation "org.springframework.modulith:spring-modulith-starter-core"
    implementation "org.springframework.modulith:spring-modulith-starter-neo4j:${springModulithVersion}"
    implementation "org.springframework.modulith:spring-modulith-events-api:${springModulithVersion}"
    runtimeOnly "org.springframework.boot:spring-boot-starter-actuator"
    runtimeOnly 'org.springframework.modulith:spring-modulith-runtime'
    runtimeOnly "org.springframework.modulith:spring-modulith-observability:${springModulithVersion}"
    runtimeOnly "org.springframework.modulith:spring-modulith-actuator:${springModulithVersion}"
    runtimeOnly "org.springframework.modulith:spring-modulith-starter-insight:${springModulithVersion}"

    /* OpenAPI */
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-api:${springDocVersion}"
    implementation "org.springdoc:springdoc-openapi-starter-common:${springDocVersion}"

    /* HTTP client */
    implementation "org.apache.httpcomponents.client5:httpclient5:${httpClientVersion}"


    /* Observability */
    implementation(platform("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.18.0"))
    implementation "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter"
    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations'
    implementation "io.opentelemetry.contrib:opentelemetry-samplers:1.47.0-alpha"
    implementation "org.springframework.boot:spring-boot-starter-aop"
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    /* Development helpers */
    implementation "org.springframework.boot:spring-boot-configuration-processor"
    developmentOnly "org.springframework.boot:spring-boot-devtools"

    /* Lombok */
    compileOnly "org.projectlombok:lombok:1.18.38"
    annotationProcessor "org.projectlombok:lombok:1.18.38"

    /* JavaX Annotations */
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // Add the processor module
    annotationProcessor project(':rules-processor')

    /* Error-prone */
    errorprone "com.google.errorprone:error_prone_core:${errorproneVersion}"
    annotationProcessor "com.google.errorprone:error_prone_core:${errorproneVersion}"

    /* Tests */
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.restdocs:spring-restdocs-mockmvc:3.0.3"
    testImplementation "org.springframework.security:spring-security-test"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation "org.junit.jupiter:junit-jupiter:5.13.0"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
        mavenBom("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.17.1")
    }
}

// Modify JavaCompile tasks configuration
tasks.withType(JavaCompile).configureEach {
    if (name.toLowerCase().contains('test')) {
        options.errorprone.enabled = false
    }

    options.compilerArgs += [
            '-Xlint:unchecked',
            '-Xlint:deprecation',
            '-Xmaxwarns', '200'
    ]

    // Enable annotation processing explicitly
    options.fork = true

    options.errorprone {
        disableWarningsInGeneratedCode = true
    }
}

// Update test configuration
tasks.named('test') {
    useJUnitPlatform()
    outputs.dir snippetsDir
    finalizedBy tasks.named('jacocoTestReport')

    jvmArgs = ['-Xmx4g']  // Replace maxHeapSize

    environment('spring.config.location', 'optional:classpath:/test-config/')

    testLogging {
        events = ['started', 'passed', 'skipped', 'failed']
        showStandardStreams = true
        outputs.upToDateWhen { false }
    }
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    dependsOn test

    attributes = [
            'snippets': snippetsDir,
            'version' : jar.archiveVersion,
            'date'    : new SimpleDateFormat("yyyy-MM-dd").format(new Date())
    ]

    sourceDir file("docs/")
    outputDir = file("build/generated-docs")

    options doctype: 'book'

    forkOptions {
        jvmArgs = [
                "--add-opens", "java.base/sun.nio.ch=ALL-UNNAMED",
                "--add-opens", "java.base/java.io=ALL-UNNAMED"
        ]
    }
}

// Update jar configuration
tasks.named('jar') {
    enabled = false
}

// Update bootJar configuration
bootJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes('Main-Class': 'org.springframework.boot.loader.launch.PropertiesLauncher')
    }
    dependsOn asciidoctor
    from("${asciidoctor.outputDir}") {
        into 'static/docs'
    }
    launchScript()
}
