plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Minimal dependencies for the API
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    // Add validation annotations
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'

    // Add Lombok for the enum
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    // Add Spring annotations as optional (for @Nullable and @Component)
    compileOnly 'org.springframework:spring-core:7.0.0'
    compileOnly 'org.springframework:spring-context:7.0.0'
    compileOnly 'org.springframework.boot:spring-boot-starter-jackson:4.0.0'

    // Add SLF4J API for logging
    compileOnly 'org.slf4j:slf4j-api:2.0.9'
}